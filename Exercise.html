<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Exercise.js" defer></script>
    <link rel="stylesheet" href="Exercise.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lobster&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="cont"></div>
    <section>

        <div class="title">
            <h1>Заявки корпуса</h1>
        </div>

        <div class="newTicket">
            <div class="problem">
                <label for="InpProblem">Что случилось?</label>
                <input type="text" id="InpProblem">
                <p id="ProblemError"></p>
            </div>

            <div class="room">
                <label for="InpRoom">Где случилось?</label>
                <input type="text" id="InpRoom">
                <p id="RoomError"></p>
            </div>

            <div class="category">
                <label for="Category"></label>
                <select id="Category">
                    <option value="">Выберите категорию</option>
                    <option value="1">Оборудование</option>
                    <option value="2">Аудитория</option>
                    <option value="3">Другое</option>
                </select>
            </div>

            <button class="addTicketBtn" id="AddTicketBtn">Добавить заявку</button>
        </div>
        <ul class="ticketUL" id="TicketUL"></ul>

        <div class="checkBox">
            <input type="checkbox" id="CheckBox">
            <label for="CheckBox">Открытые заявки</label>
        </div>

    </section>
    </div>
</body>

</html>
